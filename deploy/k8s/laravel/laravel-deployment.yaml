apiVersion: v1
kind: Namespace
metadata:
  name: avtosip
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
  namespace: avtosip
data:
  APP_NAME: "LaravelSip13"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://cluster.local"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "laravelsip13"

  ASTERISK_AMI_HOST: "192.168.1.155"
  ASTERISK_AMI_PORT: "5038"
  ASTERISK_AMI_USERNAME: "laravel"

  # artisan serve bir nechta jarayon bilan ishlashi uchun
  PHP_CLI_SERVER_WORKERS: "4"

    # ---- Real-time (Reverb) ----
  BROADCAST_CONNECTION: "reverb"
  REVERB_APP_ID: "1001"
  REVERB_APP_KEY: "avtosip"
  REVERB_HOST: "reverb-service"
  REVERB_PORT: "8080"
  REVERB_SCHEME: "http"
  REVERB_SERVER_HOST: "0.0.0.0"
  REVERB_SERVER_PORT: "8080"
---
# ---------------- WEB (API) ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
  namespace: avtosip
spec:
  replicas: 1
  strategy:
    type: Recreate          # trunk faylini ikki nusxa bir vaqtda yozmasligi uchun
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      containers:
        - name: laravel
          image: ghcr.io/ccode-php/laravelsip13:v1.0.9   # yangi tagga almashtiring
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: laravel-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: APP_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: DB_PASSWORD
            - name: ASTERISK_AMI_SECRET
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: ASTERISK_AMI_SECRET

            - name: REVERB_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: REVERB_APP_SECRET
          ports:
            - containerPort: 8000
          volumeMounts:
            # Faqat Laravel uchun ajratilgan papka (butun /etc/asterisk EMAS)
            - name: asterisk-config
              mountPath: /asterisk-config
            # Konvertatsiya qilingan audio fayllar (Asterisk shu yerdan o'qiydi)
            - name: asterisk-sounds
              mountPath: /asterisk-sounds
      volumes:
        - name: asterisk-config
          hostPath:
            path: /etc/asterisk/laravel
            type: Directory
        - name: asterisk-sounds
          hostPath:
            path: /var/lib/asterisk/sounds/campaign
            type: Directory
---
# ---------------- AMI LISTENER + KAMPANIYA NAVBATI ----------------
# Faqat 1 nusxa bo'lishi SHART, aks holda qo'ng'iroqlar ikki marta chiqadi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-listener
  namespace: avtosip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: laravel-listener
  template:
    metadata:
      labels:
        app: laravel-listener
    spec:
      containers:
        - name: listener
          image: ghcr.io/ccode-php/laravelsip13:v1.0.9   # web bilan bir xil tag
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "asterisk:listen"]
          envFrom:
            - configMapRef:
                name: laravel-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: APP_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: DB_PASSWORD
            - name: ASTERISK_AMI_SECRET
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: ASTERISK_AMI_SECRET


            - name: REVERB_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: REVERB_APP_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
  namespace: avtosip
spec:
  type: ClusterIP
  selector:
    app: laravel
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
